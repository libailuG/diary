name: Build Windows portable

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-portable:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Test application
        env:
          QT_QPA_PLATFORM: windows
        run: |
          $pythonExe = (Get-Command python).Source
          $env:PATH = "$env:pythonLocation;$env:pythonLocation\DLLs;$env:SystemRoot\System32;$env:SystemRoot"
          & $pythonExe -X faulthandler -u -m unittest discover -v
      - name: Build and verify portable executable
        run: python tools/build_portable.py
      - uses: actions/upload-artifact@v7
        with:
          name: ShiguangDiary-Windows-x64
          path: |
            dist/ShiguangDiary-Windows-x64.zip
            dist/ShiguangDiary-Windows-x64.zip.sha256
            dist/ShiguangDiary-Windows-x64.runtime-check.json
          if-no-files-found: error
          retention-days: 30
