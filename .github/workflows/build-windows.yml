name: Build Windows portable

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-portable:
    runs-on: windows-latest
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Test application
        env:
          QT_QPA_PLATFORM: windows
        run: |
          $pythonExe = (Get-Command python).Source
          $env:PATH = "$env:pythonLocation;$env:pythonLocation\DLLs;$env:SystemRoot\System32;$env:SystemRoot"
          & $pythonExe -X faulthandler -u -m unittest discover -v
      - name: Build and verify portable executable
        run: python tools/build_portable.py
      - uses: actions/upload-artifact@v7
        with:
          name: ShiguangDiary-Windows-x64
          path: |
            dist/ShiguangDiary-Windows-x64.zip
            dist/ShiguangDiary-Windows-x64.zip.sha256
            dist/ShiguangDiary-Windows-x64.runtime-check.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish share release
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          @'
          拾光日记 Windows x64 分享版。完整解压后双击 ShiguangDiary.exe，无需安装 Python、Conda 或 PyQt。

          初始登录密码：123456。登录后可在“文件 → 登录密码”中修改。
          分享包不包含日记数据、附件、备份或个人配置。个人数据首次运行后保存在程序旁的 data 文件夹。
          支持后台图片导入、富文本、图片与表格、HTML/PDF 导出、备份恢复。
          密码只限制软件界面访问，日记文件本身未加密。

          附带 SHA256 校验文件和运行检查报告。
          '@ | Set-Content -LiteralPath release-notes.md -Encoding utf8
          gh release create v1.1.0 dist/ShiguangDiary-Windows-x64.zip dist/ShiguangDiary-Windows-x64.zip.sha256 dist/ShiguangDiary-Windows-x64.runtime-check.json --target "$env:GITHUB_SHA" --title "拾光日记 v1.1.0 · Windows 分享版" --notes-file release-notes.md
